services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: simplerest
      MYSQL_USER: kyle
      MYSQL_PASSWORD: changeMe12
      MYSQL_ROOT_PASSWORD: rootChangeMe12
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kyle", "-pchangeMe12"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_DSN: kyle:changeMe12@tcp(mysql:3306)/simplerest?charset=utf8mb4&parseTime=True&loc=Local
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
